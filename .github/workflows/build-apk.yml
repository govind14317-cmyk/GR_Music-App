steps:
  - name: Checkout
    uses: actions/checkout@v7

  - name: Setup Java 17
    uses: actions/setup-java@v6
    with:
      distribution: temurin
      java-version: '17'

  - name: Setup Android SDK
    uses: android-actions/setup-android@v4

  - name: Find and extract GSR Android ZIP
    shell: bash
    run: |
      set -e

      ZIP_FILE="$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -iname '*.zip' -print -quit)"

      if [ -z "$ZIP_FILE" ]; then
        echo "ERROR: No ZIP file found in repository root."
        ls -la
        exit 1
      fi

      echo "Using ZIP: $ZIP_FILE"

      rm -rf "$GITHUB_WORKSPACE/gsr-project"
      mkdir -p "$GITHUB_WORKSPACE/gsr-project"
      unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/gsr-project"

      PROJECT_DIR="$(find "$GITHUB_WORKSPACE/gsr-project" -type f \-name settings.gradle -o -name settings.gradle.kts \ -print -quit | xargs -r dirname)"

      if [ -z "$PROJECT_DIR" ]; then
        echo "ERROR: Android project settings.gradle/settings.gradle.kts not found."
        echo "ZIP contents:"
        find "$GITHUB_WORKSPACE/gsr-project" -maxdepth 4 -type f | head -100
        exit 1
      fi

      echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
      echo "Android project: $PROJECT_DIR"

  - name: Setup Gradle
    uses: gradle/actions/setup-gradle@v6
    with:
      gradle-version: '8.10.2'

  - name: Build Debug APK
    working-directory: ${{ env.PROJECT_DIR }}
    run: gradle --no-daemon clean assembleDebug --stacktrace

  - name: Find APK
    shell: bash
    run: |
      set -e
      APK="$(find "${{ env.PROJECT_DIR }}/app/build/outputs/apk" -type f -name '*.apk' -print -quit)"

      if [ -z "$APK" ]; then
        echo "ERROR: APK was not generated."
        exit 1
      fi

      echo "APK found: $APK"
      cp "$APK" "$GITHUB_WORKSPACE/GSR.apk"

  - name: Upload GSR APK
    uses: actions/upload-artifact@v7
    with:
      name: GSR-Android-APK
      path: GSR.apk
      if-no-files-found: error
      retention-days: 14
