name: Build GSR APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Extract GSR Android project
        shell: bash
        run: |
          set -e

          rm -rf gsr-project
          mkdir -p gsr-project

          unzip -q GSR_Native_Android_Studio_Project.zip -d gsr-project

          PROJECT_DIR="$(dirname "$(find "$PWD/gsr-project" -name settings.gradle -type f -print -quit)")"

          if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "." ]; then
            echo "ERROR: settings.gradle was not found inside the ZIP."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found at: $PROJECT_DIR"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle --no-daemon clean assembleDebug --stacktrace

      - name: Find APK
        shell: bash
        run: |
          set -e

          APK="$(find "${{ env.PROJECT_DIR }}/app/build/outputs/apk" \
            -type f -name '*.apk' -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          cp "$APK" "$GITHUB_WORKSPACE/GSR.apk"

      - name: Upload GSR APK
        uses: actions/upload-artifact@v7
        with:
          name: GSR-Android-APK
          path: GSR.apk
          if-no-files-found: error
          retention-days: 14
